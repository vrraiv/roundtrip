name: publish

# Deploy the static site built from REPORTS/ to Cloudflare Pages, only after the owner
# approves the run in the GitHub `release` environment (required reviewer = owner).
# The approval is then recorded in releases/index.json together with a copy of the
# approved estimates bundle, and committed to the default branch.
#
# Run from the default branch after a candidate PR has been merged:
#   gh workflow run publish.yml -f month=YYYY-MM

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Candidate month being released (YYYY-MM); its reviews/YYYY-MM.md must be complete"
        required: true

permissions:
  contents: write

jobs:
  gate:
    # Fails fast if the review record is incomplete, before asking anyone to approve.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run roundtrip release check --month "${{ inputs.month }}"

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Pages project lives in the same Cloudflare account as the R2 bucket.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

      - name: Record the approval
        run: |
          uv run roundtrip release approve --month "${{ inputs.month }}" --bundle REPORTS/estimates.json
          cat releases/index.json

      - name: Build site
        run: uv run roundtrip build-site --out site

      - name: Cloudflare account id
        id: cf
        run: |
          ID=$(uv run python -c "from roundtrip.config import get_settings; print(get_settings().r2.account_id or '')")
          echo "account_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Create Pages project if needed
        continue-on-error: true
        run: npx --yes wrangler@3 pages project create roundtrip --production-branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy site --project-name=roundtrip --branch=main

      - name: Commit the release record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          git commit -m "release ${{ inputs.month }}: approved and published" || echo "nothing to commit"
          git push
