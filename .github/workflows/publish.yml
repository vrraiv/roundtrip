name: publish

# Deploy the static site built from REPORTS/ to Cloudflare Pages, only after the owner
# approves the run in the GitHub `release` environment (required reviewer = owner).
# The approval is then recorded in releases/index.json together with a copy of the
# approved estimates bundle, and committed to the default branch.
#
# Run from the default branch after a candidate PR has been merged:
#   gh workflow run publish.yml -f month=YYYY-MM

on:
  workflow_dispatch:
    inputs:
      month:
        description: "Candidate month being released (YYYY-MM); its reviews/YYYY-MM.md must be complete"
        required: true
      issue:
        description: "Review issue number that started this (set by review.yml); it is told the outcome and closed"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  gate:
    # Fails fast if the review record is incomplete, before asking anyone to approve.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run roundtrip release check --month "${{ inputs.month }}"
      - name: Check the Cloudflare token before asking for approval
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN secret is empty"; exit 1; fi
          export CLOUDFLARE_ACCOUNT_ID=$(uv run python -c "from roundtrip.config import get_settings; print(get_settings().r2.account_id or '')")
          echo "account id: ${#CLOUDFLARE_ACCOUNT_ID} chars"
          npx --yes wrangler@3 pages project list             || { echo "The token cannot list Pages projects. It needs 'Cloudflare Pages: Edit' on this account."; exit 1; }

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: ${{ steps.deploy.outputs.deployment-url }}
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The Pages project lives in the same Cloudflare account as the R2 bucket.
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

      - name: Record the approval
        run: |
          uv run roundtrip release approve --month "${{ inputs.month }}" --bundle REPORTS/estimates.json
          cat releases/index.json

      - name: Build site
        run: uv run roundtrip build-site --out site

      - name: Cloudflare account id
        id: cf
        run: |
          ID=$(uv run python -c "from roundtrip.config import get_settings; print(get_settings().r2.account_id or '')")
          echo "account_id=$ID" >> "$GITHUB_OUTPUT"

      - name: Create Pages project if needed
        continue-on-error: true
        run: npx --yes wrangler@3 pages project create roundtrip --production-branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy site --project-name=roundtrip --branch=main

      - name: Commit the release record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/
          git commit -m "release ${{ inputs.month }}: approved and published" || echo "nothing to commit"
          git push

  notify:
    # Tell the review issue (if one started this run) how it ended, and close it on success.
    needs: [gate, release]
    if: always() && inputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Comment and close
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "${{ needs.release.result }}" = "success" ]; then
            gh issue comment "${{ inputs.issue }}" --repo "${{ github.repository }}" \
              --body "Published ${{ inputs.month }}: ${{ needs.release.outputs.url }} (run $RUN). Approval recorded in releases/index.json."
            gh issue close "${{ inputs.issue }}" --repo "${{ github.repository }}" --reason completed
          else
            gh issue comment "${{ inputs.issue }}" --repo "${{ github.repository }}" \
              --body "Publish did not complete (gate: ${{ needs.gate.result }}, release: ${{ needs.release.result }}). See $RUN. Nothing was published; edit the issue to resubmit, or rerun publish.yml."
          fi
