name: monthly

# Detect newly published TLC months, process each one (validate, build panel and
# sample), mirror derived outputs to R2, re-run the analyses on the full panel, build
# the candidate report and review record, and open a candidate PR. Nothing is published
# from a candidate PR until the review gate (publish.yml, GitHub `release` environment)
# approves it. Hard validation failures open an issue.

on:
  schedule:
    - cron: "0 9 * * 1" # weekly; TLC publishes with ~2 months lag on irregular days
  workflow_dispatch:
    inputs:
      max_months:
        description: "Process at most this many new months"
        default: "2"
      force_analysis:
        description: "Run the analyses and open a candidate PR even if no new month"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  # Either secret name works; the brief says R2_BUCKET, the bucket was first added as R2_BUCKET_NAME.
  R2_BUCKET: ${{ secrets.R2_BUCKET || secrets.R2_BUCKET_NAME }}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      months: ${{ steps.discover.outputs.months }}
      any: ${{ steps.discover.outputs.any }}
      # job-level `if` cannot read env or secrets, so the bucket check is passed as an output
      has_bucket: ${{ steps.discover.outputs.has_bucket }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Pull manifest from R2
        if: env.R2_BUCKET != ''
        run: uv run roundtrip sync --prefix manifest.json
      - name: Fall back to the committed manifest
        if: env.R2_BUCKET == ''
        run: mkdir -p data/derived && cp manifest.json data/derived/manifest.json 2>/dev/null || true
      - id: discover
        run: |
          LIMIT="${{ inputs.max_months || '2' }}"
          OUT=$(uv run roundtrip discover --json)
          echo "$OUT"
          MONTHS=$(echo "$OUT" | uv run python -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d['new'][:int('$LIMIT')]))")
          echo "months=$MONTHS" >> "$GITHUB_OUTPUT"
          if [ "$MONTHS" = "[]" ]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$R2_BUCKET" ]; then echo "has_bucket=true" >> "$GITHUB_OUTPUT"; else echo "has_bucket=false" >> "$GITHUB_OUTPUT"; fi
          echo "$OUT" | uv run python -c "import json,sys; d=json.load(sys.stdin); print('revised months needing --force:', d['revised'])"

  process:
    needs: discover
    if: needs.discover.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        month: ${{ fromJson(needs.discover.outputs.months) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Pull manifest from R2
        if: env.R2_BUCKET != ''
        run: uv run roundtrip sync --prefix manifest.json
      - name: Fall back to the committed manifest
        if: env.R2_BUCKET == ''
        run: mkdir -p data/derived && cp manifest.json data/derived/manifest.json 2>/dev/null || true

      - name: Process ${{ matrix.month }}
        id: process
        run: |
          /usr/bin/time -v uv run roundtrip process-month --month ${{ matrix.month }} 2> time.log
          STATUS=$?
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" time.log || true
          exit $STATUS

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ matrix.month }}"
            grep -E "Maximum resident set size|Elapsed \(wall clock\)" time.log | sed 's/^/    /' || true
            echo
            cat data/derived/validation/${{ matrix.month }}.md 2>/dev/null || echo "_no validation report_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Push outputs to R2
        if: env.R2_BUCKET != '' && steps.process.outcome == 'success'
        run: uv run roundtrip push --month ${{ matrix.month }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: derived-${{ matrix.month }}
          path: |
            data/derived/manifest.json
            data/derived/validation/${{ matrix.month }}.*
            data/derived/runs/*-${{ matrix.month }}/
          retention-days: 90
          if-no-files-found: warn

      - name: Open issue on hard validation failure
        if: failure() && steps.process.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          {
            echo "Run: $RUN_URL"
            echo
            cat data/derived/validation/${{ matrix.month }}.md 2>/dev/null               || echo "process-month failed before a report was written; see the run log."
          } > issue_body.md
          gh issue create --title "validation failed: ${{ matrix.month }}"             --label data-quality --body-file issue_body.md

  analyze:
    needs: [discover, process]
    if: >
      always() && needs.discover.outputs.has_bucket == 'true' &&
      ((needs.discover.outputs.any == 'true' && needs.process.result == 'success') ||
       inputs.force_analysis == true)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      month: ${{ steps.report.outputs.month }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Pull panel, zones, validation reports and manifest from R2
        run: |
          uv run roundtrip sync --prefix manifest.json
          uv run roundtrip sync --prefix zones/
          uv run roundtrip sync --prefix validation/
          uv run roundtrip sync --prefix panel/
      - name: Run causal analyses
        run: |
          /usr/bin/time -v uv run roundtrip run-causal --out data/derived/estimates/latest 2> time.log
          STATUS=$?
          grep -E "Maximum resident set size|Elapsed \(wall clock\)" time.log || true
          exit $STATUS
      - name: Build report and review record
        id: report
        run: |
          uv run roundtrip report --bundle data/derived/estimates/latest/estimates.json
          MONTH=$(uv run python -c "import json; print(json.load(open('REPORTS/estimates.json'))['months'][-1])")
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          uv run roundtrip release prepare --month "$MONTH" --bundle REPORTS/estimates.json
          mkdir -p validation
          cp data/derived/validation/*.md data/derived/validation/*.json validation/ 2>/dev/null || true
          cp data/derived/manifest.json manifest.json
      - name: Summary
        if: always()
        run: |
          {
            echo "## Analysis"
            echo
            uv run roundtrip estimates-summary data/derived/estimates/latest/estimates.json 2>/dev/null || echo "_no estimates bundle_"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate
          path: |
            REPORTS/
            reviews/${{ steps.report.outputs.month }}.md
            validation/
            manifest.json
          retention-days: 90
          if-no-files-found: warn

  candidate:
    needs: [discover, analyze]
    if: always() && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: .
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen

      # A preview of the public site for the reviewer to read on a phone. Pages preview
      # deployments are free; the production site only changes through publish.yml.
      - name: Build the candidate site
        run: uv run roundtrip build-site --out site
      - name: Cloudflare account id
        id: cf
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          ID=$(uv run python -c "from roundtrip.config import get_settings; print(get_settings().r2.account_id or '')")
          echo "account_id=$ID" >> "$GITHUB_OUTPUT"
      - name: Create Pages project if needed
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        run: npx --yes wrangler@3 pages project create roundtrip --production-branch main
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
      - name: Deploy the preview
        id: preview
        if: env.CLOUDFLARE_API_TOKEN != ''
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ steps.cf.outputs.account_id }}
          command: pages deploy site --project-name=roundtrip --branch=candidate-${{ needs.analyze.outputs.month }}

      - name: Write the PR body
        id: body
        env:
          PREVIEW: ${{ steps.preview.outputs.deployment-url }}
        run: |
          MONTH="${{ needs.analyze.outputs.month }}"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"
          RUN_ID=$(uv run python -c "import json; print(json.load(open('REPORTS/estimates.json'))['run_id'])")
          REVIEW_URL="${{ github.server_url }}/${{ github.repository }}/issues/new?template=review.yml&title=Review+$MONTH&month=$MONTH&run_id=$RUN_ID"
          {
            echo "## Candidate: $MONTH (run \`$RUN_ID\`)"
            echo
            echo "New months processed this run: ${{ needs.discover.outputs.months }}"
            echo
            if [ -n "$PREVIEW" ]; then echo "**Preview site:** $PREVIEW"; echo; fi
            echo "**To review from any device:** [open the review form]($REVIEW_URL) (month and run id are filled in), answer it, submit. The \`review\` workflow writes \`reviews/$MONTH.md\`, merges this PR on approval and starts \`publish.yml\`, which waits for your tap in the \`release\` environment. A rejection closes this PR with your reason."
            echo
            echo "Files: \`REPORTS/congestion_pricing.md\` (report and review dashboard), \`reviews/$MONTH.md\` (the record; filled in by the form, or by hand), \`validation/\`, \`manifest.json\`."
            echo
            sed -n '/## Review dashboard/,$p' REPORTS/congestion_pricing.md
            echo
            echo "By hand instead: fill in \`reviews/$MONTH.md\`, merge, then run \`gh workflow run publish.yml -f month=$MONTH\` and approve the \`release\` environment; or \`uv run roundtrip release reject --month $MONTH --reason '...'\` on main and push."
          } > pr_body.md
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: candidate/${{ steps.body.outputs.month }}
          title: "candidate: ${{ steps.body.outputs.month }}"
          commit-message: "candidate ${{ steps.body.outputs.month }}: report, review record, validation, manifest"
          body-path: pr_body.md
          labels: candidate
          add-paths: |
            REPORTS/
            reviews/
            validation/
            manifest.json
