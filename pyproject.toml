[project]
name = "roundtrip"
version = "0.1.0"
description = "NYC ride-hail marketplace economics: a re-running pipeline on TLC HVFHV data with causal and ML analyses."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "vrraiv" }]
dependencies = [
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "httpx>=0.27",
    "boto3>=1.35",
    "pyarrow>=17",
    "pandas>=2.2",
    "scipy>=1.14",
    "pyfixest>=0.30",
    "matplotlib>=3.9",
    "markdown>=3.7",
]

[project.scripts]
roundtrip = "roundtrip.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "boto3-stubs[s3]>=1.35",
    "pandas-stubs>=2.2",
    "pyarrow-stubs>=17",
    "types-markdown>=3.10.2.20261007",
    "scipy-stubs>=1.18.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roundtrip"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "PL", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0915",
    "PLR0917", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "ARG001"]
"tests/conftest.py" = ["E501"]  # embedded SQL for the synthetic generator

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:roundtrip.*"]
